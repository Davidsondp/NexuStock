databases:
  - name: nexustock-db
    databaseName: nexustock
    user: nexustock
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: nexustock
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: flask --app run.py db upgrade && flask --app run.py seed-planes
    startCommand: gunicorn --config gunicorn.conf.py run:app
    healthCheckPath: /estado/preparacion
    envVars:
      - key: FLASK_ENV
        value: produccion
      - key: DATABASE_URL
        fromDatabase:
          name: nexustock-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_PAGOS_SECRET
        generateValue: true
      - key: LIMITE_SOLICITUDES_SECRET
        generateValue: true
      - key: TRUSTED_HOSTS
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
