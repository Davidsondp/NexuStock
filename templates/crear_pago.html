{% extends "base.html" %}

{% block title %}
Nuevo Pago | Super Administrador
{% endblock %}

{% block header %}
Registrar Pago
{% endblock %}

{% block content %}

<div class="max-w-5xl mx-auto">

    <div class="bg-white rounded-3xl shadow-xl p-10">

        <div class="mb-8">

            <h1 class="text-4xl font-black text-gray-800">

                💳 Registrar Pago

            </h1>

            <p class="text-gray-500 mt-2">

                Registra manualmente un pago realizado por una empresa.

            </p>

        </div>

        <form method="POST" class="space-y-8">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="grid md:grid-cols-2 gap-6">

                <div>

                    <label class="font-semibold text-gray-700">

                        Empresa

                    </label>

                    <select
                        name="empresa_id"
                        required
                        class="w-full mt-2 border rounded-xl p-3">

                        <option value="">
                            Seleccione...
                        </option>

                        {% for empresa in empresas %}

                        <option value="{{ empresa.id }}">

                            {{ empresa.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div>

                    <label class="font-semibold text-gray-700">

                        Monto

                    </label>

                    <input
                        type="number"
                        name="monto"
                        min="0"
                        step="1"
                        required
                        class="w-full mt-2 border rounded-xl p-3">

                </div>

                <div>

                    <label class="font-semibold text-gray-700">

                        Estado

                    </label>

                    <select
                        name="estado"
                        class="w-full mt-2 border rounded-xl p-3">

                        <option value="pagado">

                            Pagado

                        </option>

                        <option value="pendiente">

                            Pendiente

                        </option>

                        <option value="rechazado">

                            Rechazado

                        </option>

                        <option value="reembolsado">

                            Reembolsado

                        </option>

                    </select>

                </div>

                <div>

                    <label class="font-semibold text-gray-700">

                        Método de pago

                    </label>

                    <select
                        name="metodo_pago"
                        class="w-full mt-2 border rounded-xl p-3">

                        <option value="Transferencia">

                            Transferencia

                        </option>

                        <option value="Webpay">

                            Webpay

                        </option>

                        <option value="Mercado Pago">

                            Mercado Pago

                        </option>

                        <option value="Stripe">

                            Stripe

                        </option>

                        <option value="Efectivo">

                            Efectivo

                        </option>

                    </select>

                </div>

            </div>

            <div>

                <label class="font-semibold text-gray-700">

                    Observaciones

                </label>

                <textarea
                    name="observaciones"
                    rows="4"
                    class="w-full mt-2 border rounded-xl p-3"></textarea>

            </div>

            <div class="flex justify-end gap-4">

                <a
                    href="{{ url_for('super_admin_pagos') }}"
                    class="px-6 py-3 rounded-xl bg-gray-200 hover:bg-gray-300">

                    Cancelar

                </a>

                <button
                    type="submit"
                    class="px-8 py-3 rounded-xl bg-green-600 text-white hover:bg-green-700">

                    💾 Guardar Pago

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
