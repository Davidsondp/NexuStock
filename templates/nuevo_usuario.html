{% extends "base.html" %}

{% block title %}
Nuevo Usuario - NexuStock
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white rounded-xl shadow p-8">

    <h2 class="text-3xl font-bold mb-2">
        👤 Crear Usuario
    </h2>

    <p class="text-gray-500 mb-6">
        Registra empleados o administradores de la empresa.
    </p>

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div class="mb-5">

            <label class="block font-semibold mb-2">
                Nombre completo
            </label>

            <input
                type="text"
                name="nombre"
                required
                placeholder="Ej: Juan Pérez"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500"
            >

        </div>

        <div class="mb-5">

            <label class="block font-semibold mb-2">
                Correo electrónico
            </label>

            <input
                type="email"
                name="email"
                required
                placeholder="correo@empresa.com"
                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500"
            >

        </div>

        <div class="mb-5">

            <label class="block font-semibold mb-2">
                Contraseña
            </label>

            <div class="flex gap-2">

                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                    class="flex-1 border rounded-lg px-4 py-3"
                >

                <button
                    type="button"
                    onclick="mostrarPassword()"
                    class="bg-gray-200 px-4 rounded-lg"
                >
                    👁️
                </button>

            </div>

        </div>

        <div class="mb-6">

            <label class="block font-semibold mb-2">
                Tipo de usuario
            </label>

            <select
                name="rol"
                class="w-full border rounded-lg px-4 py-3"
            >

                <option value="empleado">
                    👤 Empleado
                </option>

                <option value="supervisor">
                    👨‍💼 Supervisor
                </option>

                <option value="admin_empresa">
                    🏢 Administrador de Empresa
                </option>

            </select>

            <p class="text-sm text-gray-500 mt-2">
                El administrador puede gestionar usuarios, productos e inventario de su empresa.
            </p>

        </div>

        <div class="flex gap-3">

            <button
                type="submit"
                class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700"
            >
                💾 Guardar Usuario
            </button>

            <a
                href="{{ url_for('usuarios') }}"
                class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

<script>

function mostrarPassword() {

    let campo = document.getElementById("password");

    if (campo.type === "password") {
        campo.type = "text";
    } else {
        campo.type = "password";
    }

}

</script>

{% endblock %}
