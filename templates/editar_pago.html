{% extends "base.html" %}

{% block title %}
Editar Pago
{% endblock %}

{% block header %}
Editar Pago
{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <div class="bg-white rounded-2xl shadow">

        <div class="border-b px-8 py-6">

            <h1 class="text-3xl font-black text-slate-800">

                ✏️ Editar Pago #{{ pago.id }}

            </h1>

            <p class="text-slate-500 mt-2">

                Modifique la información del pago.

            </p>

        </div>

        <form method="POST" class="p-8 space-y-6">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div>

                <label class="font-semibold">

                    Empresa

                </label>

                <input

                    class="w-full mt-2 rounded-xl border p-3 bg-gray-100"

                    value="{{ pago.empresa.nombre if pago.empresa else '-' }}"

                    readonly

                >

            </div>

            <div class="grid md:grid-cols-2 gap-6">

                <div>

                    <label class="font-semibold">

                        Monto

                    </label>

                    <input

                        type="number"

                        step="0.01"

                        name="monto"

                        value="{{ pago.monto }}"

                        class="w-full mt-2 rounded-xl border p-3"

                        required

                    >

                </div>

                <div>

                    <label class="font-semibold">

                        Estado

                    </label>

                    <select

                        name="estado"

                        class="w-full mt-2 rounded-xl border p-3"

                    >

                        <option value="pendiente"
                            {% if pago.estado=="pendiente" %}selected{% endif %}>
                            Pendiente
                        </option>

                        <option value="pagado"
                            {% if pago.estado=="pagado" %}selected{% endif %}>
                            Pagado
                        </option>

                        <option value="rechazado"
                            {% if pago.estado=="rechazado" %}selected{% endif %}>
                            Rechazado
                        </option>

                    </select>

                </div>

            </div>

            <div>

                <label class="font-semibold">

                    Método de pago

                </label>

                <input

                    type="text"

                    name="metodo_pago"

                    value="{{ pago.metodo_pago or '' }}"

                    class="w-full mt-2 rounded-xl border p-3"

                >

            </div>

            <div>

                <label class="font-semibold">

                    Observaciones

                </label>

                <textarea

                    name="observaciones"

                    rows="5"

                    class="w-full mt-2 rounded-xl border p-3"

                >{{ pago.observaciones or "" }}</textarea>

            </div>

            <div class="flex justify-end gap-4">

                <a

                    href="{{ url_for('super_admin_pagos') }}"

                    class="bg-gray-300 hover:bg-gray-400 px-6 py-3 rounded-xl"

                >

                    Cancelar

                </a>

                <button

                    class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl"

                >

                    Guardar cambios

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
