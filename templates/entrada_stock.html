{% extends "base.html" %}


{% block title %}
Entrada de Stock | NexuStock
{% endblock %}



{% block content %}


<div class="max-w-3xl mx-auto">


    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">


        <!-- HEADER -->

        <div class="bg-gradient-to-r from-green-600 to-emerald-500 p-8 text-white">

            <h1 class="text-3xl font-bold">
                📥 Entrada de Stock
            </h1>


            <p class="mt-2 text-green-100">
                Registra nuevas unidades al inventario de tu empresa.
            </p>


        </div>




        <div class="p-8">


            <form method="POST">


                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >



                <!-- PRODUCTO -->


                <div class="mb-6">


                    <label class="block font-semibold mb-2">

                        Producto

                    </label>



                    <select
                        name="producto_id"
                        id="producto"
                        required
                        class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-green-500 focus:outline-none"
                    >


                        <option value="">
                            Seleccione un producto
                        </option>


                        {% for producto in productos %}


                        <option

                            value="{{ producto.id }}"

                            data-unidades="{{ producto.unidades_por_caja or 1 }}"

                            {% if producto_preseleccionado and producto.id|string == producto_preseleccionado|string %}
                                selected
                            {% endif %}

                        >

                            {{ producto.nombre }}

                            |
                            Stock:
                            {{ producto.stock }}

                            |
                            Caja:
                            {{ producto.unidades_por_caja or 1 }}

                            uds

                        </option>


                        {% endfor %}


                    </select>


                </div>





                <!-- DATOS ENTRADA -->


                <div class="grid md:grid-cols-2 gap-6">



                    <div>


                        <label class="block font-semibold mb-2">

                            📦 Cantidad de cajas

                        </label>


                        <input

                            type="number"

                            id="cajas"

                            name="cajas"

                            min="0"

                            value="0"

                            class="w-full border rounded-xl px-4 py-3"

                        >


                    </div>





                    <div>


                        <label class="block font-semibold mb-2">

                            🔢 Unidades adicionales

                        </label>


                        <input

                            type="number"

                            id="cantidad"

                            name="cantidad"

                            min="0"

                            value="0"

                            class="w-full border rounded-xl px-4 py-3"

                        >


                    </div>



                </div>






                <!-- RESUMEN -->


                <div class="mt-8 bg-green-50 border border-green-200 rounded-xl p-6">



                    <div class="flex justify-between items-center">


                        <div>


                            <p class="text-sm text-gray-600">

                                Total ingresar

                            </p>


                            <p class="text-green-700 font-bold text-lg">

                                Unidades nuevas

                            </p>


                        </div>




                        <span

                            id="total"

                            class="text-4xl font-bold text-green-600"

                        >

                            0

                        </span>



                    </div>



                </div>






                <!-- BOTONES -->


                <div class="mt-8 flex flex-col md:flex-row gap-4">



                    <button

                        type="submit"

                        class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition"

                    >

                        📥 Registrar Entrada

                    </button>





                    <a

                        href="{{ url_for('movimientos') }}"

                        class="flex-1 text-center bg-gray-200 hover:bg-gray-300 py-3 rounded-xl transition"

                    >

                        Cancelar

                    </a>



                </div>



            </form>


        </div>


    </div>


</div>





<script>


const producto =
document.getElementById(
    "producto"
);


const cajas =
document.getElementById(
    "cajas"
);


const cantidad =
document.getElementById(
    "cantidad"
);


const total =
document.getElementById(
    "total"
);




function calcularTotal(){


    if(!producto.value){

        total.textContent = 0;

        return;

    }



    const opcion =
    producto.options[
        producto.selectedIndex
    ];



    const unidadesCaja =
    parseInt(
        opcion.dataset.unidades || 1
    );



    const cantidadCajas =
    parseInt(
        cajas.value || 0
    );



    const unidadesDirectas =
    parseInt(
        cantidad.value || 0
    );



    total.textContent =

        (
            cantidadCajas *
            unidadesCaja
        )
        +
        unidadesDirectas;



}




producto.addEventListener(
    "change",
    calcularTotal
);



cajas.addEventListener(
    "input",
    calcularTotal
);



cantidad.addEventListener(
    "input",
    calcularTotal
);



calcularTotal();


</script>



{% endblock %}
