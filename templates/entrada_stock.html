<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrada de Stock - NexuStock</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<div class="bg-green-600 text-white p-4 shadow">

    <div class="flex justify-between items-center">

        <h1 class="text-2xl font-bold">
            📦 NexuStock
        </h1>


        <div class="space-x-5">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/productos">
                Productos
            </a>

            <a href="/movimientos">
                Movimientos
            </a>

        </div>

    </div>

</div>



<div class="max-w-2xl mx-auto mt-8 bg-white p-8 rounded-xl shadow">


<h2 class="text-3xl font-bold mb-6">
    📥 Entrada de Stock
</h2>



<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">



<div class="mb-5">

<label class="block font-semibold mb-2">
    Producto
</label>


<select
name="producto_id"
id="producto"
class="w-full border rounded-lg px-4 py-3"
>


{% for producto in productos %}


<option

value="{{ producto.id }}"

data-unidades="{{ producto.unidades_por_caja }}"

{% if producto_preseleccionado and producto.id == producto_preseleccionado|int %}
selected
{% endif %}

>

{{ producto.nombre }}

| Stock actual:
{{ producto.stock }} unidades

| Caja:
{{ producto.unidades_por_caja }}

uds

</option>


{% endfor %}


</select>

</div>




<div class="mb-5">

<label class="block font-semibold mb-2">
    Cantidad de cajas
</label>


<input

type="number"

name="cajas"

id="cajas"

min="0"

value="0"

class="w-full border rounded-lg px-4 py-3"

>


</div>





<div class="mb-5">

<label class="block font-semibold mb-2">
    Unidades directas
</label>


<input

type="number"

name="cantidad"

id="cantidad"

min="0"

value="0"

class="w-full border rounded-lg px-4 py-3"

>


</div>





<div class="mb-6 bg-gray-100 p-4 rounded-lg">


<p class="font-semibold">

Total unidades a ingresar:

<span id="total">
0
</span>

</p>


</div>





<button

type="submit"

class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700"

>

Registrar Entrada

</button>



</form>


</div>





<script>


const producto =
document.getElementById(
"producto"
);


const cajas =
document.getElementById(
"cajas"
);


const cantidad =
document.getElementById(
"cantidad"
);


const total =
document.getElementById(
"total"
);



function calcular(){


let opcion =
producto.options[
producto.selectedIndex
];


let unidadesCaja =
parseInt(
opcion.dataset.unidades || 1
);



let totalUnidades =

(
parseInt(cajas.value || 0)
*
unidadesCaja
)

+

parseInt(
cantidad.value || 0
);



total.innerHTML =
totalUnidades;


}



cajas.addEventListener(
"input",
calcular
);


cantidad.addEventListener(
"input",
calcular
);


producto.addEventListener(
"change",
calcular
);



calcular();


</script>



</body>

</html>
