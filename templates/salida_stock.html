{% extends "base.html" %}

{% block title %}
Salida de Stock - NexuStock
{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <div class="bg-white rounded-xl shadow p-8">

        <h2 class="text-3xl font-bold mb-2">
            📤 Salida de Stock
        </h2>

        <p class="text-gray-500 mb-6">
            Registra salidas de inventario por cajas o unidades.
        </p>

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <!-- PRODUCTO -->

            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Producto
                </label>

                <select
                    name="producto_id"
                    id="producto"
                    class="w-full border rounded-lg px-4 py-3"
                    required
                >

                    {% for producto in productos %}

                    <option
                        value="{{ producto.id }}"
                        data-unidades="{{ producto.unidades_por_caja }}"
                    >

                        {{ producto.nombre }}
                        | Stock: {{ producto.stock }} unidades
                        | Caja: {{ producto.unidades_por_caja }} uds

                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- CAJAS -->

            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Cantidad de cajas
                </label>

                <input
                    type="number"
                    name="cajas"
                    id="cajas"
                    min="0"
                    value="0"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>

            <!-- UNIDADES -->

            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Unidades directas
                </label>

                <input
                    type="number"
                    name="cantidad"
                    id="cantidad"
                    min="0"
                    value="0"
                    class="w-full border rounded-lg px-4 py-3"
                >

            </div>

            <!-- TOTAL -->

            <div class="mb-6 bg-red-50 border border-red-200 p-4 rounded-lg">

                <p class="font-semibold text-red-700">

                    Total unidades a retirar:

                    <span id="total">
                        0
                    </span>

                </p>

            </div>

            <!-- BOTONES -->

            <div class="flex gap-3">

                <button
                    type="submit"
                    class="bg-red-600 text-white px-6 py-3 rounded-lg hover:bg-red-700"
                >
                    📤 Registrar Salida
                </button>

                <a
                    href="{{ url_for('movimientos') }}"
                    class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

<script>

const producto = document.getElementById("producto");
const cajas = document.getElementById("cajas");
const cantidad = document.getElementById("cantidad");
const total = document.getElementById("total");

function calcular() {

    const opcion =
        producto.options[
            producto.selectedIndex
        ];

    const unidadesCaja =
        parseInt(
            opcion.dataset.unidades || 1
        );

    const totalUnidades =
        (
            parseInt(cajas.value || 0)
            * unidadesCaja
        )
        +
        parseInt(cantidad.value || 0);

    total.textContent =
        totalUnidades;

}

cajas.addEventListener(
    "input",
    calcular
);

cantidad.addEventListener(
    "input",
    calcular
);

producto.addEventListener(
    "change",
    calcular
);

calcular();

</script>

{% endblock %}
